    <style>/*是的各位，我又找AI幫忙改了*/
:root {
    --bg-color: #262344;       /* 深背景色 */
    --card-bg: #353457;        /* 卡片/區塊背景 */
    --text-primary: #e0e0e0;   /* 主文字顏色 */
    --text-secondary: #b0b0b0; /* 次要文字顏色 */
    --accent-color: #caaafa;   /* 強調粉紫色 */
    --nav-hover: #45289a;      /* 導覽列懸停深紫 */
}

body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    margin: 0;
    line-height: 1.6;
}

/* 頁首樣式 */
header {
    background-color: var(--card-bg);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #3d3b66; /* 稍微帶點紫的深色邊框，比純 #333 更融入 */
}

.logo {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--accent-color);
    letter-spacing: 1px;
}

nav a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.3s;
}

nav a:hover {
    color: var(--accent-color);
}

/* 主內容區樣式 */
#blog, #comment, #posts-list, #timeline {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
}

#blog, #comment {
    border: #3d3b66 solid 1px; /* 統一改用帶紫的邊框 */
    border-radius: 30px;
}

#title {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
}

/* 頁尾樣式 */
footer {
    text-align: center;
    padding: 2rem;
    margin-top: 50px;
    background-color: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.9rem;
}

a {
    color: var(--accent-color);
    text-decoration: none;
}

/* 讓 Markdown 裡的圖片不要爆出去 */
img {
    max-width: 100%;
    border-radius: 8px;
}

#home {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.hero {
    text-align: center;
    margin-bottom: 50px;
}

article {
    background-color: var(--card-bg);
    /* 🛠️ 修正這裡：原本寫 var(--nav-hover: #45289a;) 是錯誤語法，會導致邊框消失 */
    border: 1px solid var(--nav-hover); 
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    transition: transform 0.2s;
}

.post-card:hover {
    transform: translateY(-3px);
}

.post-time {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.post-description {
    margin-top: 10px;
}

.tags {
    margin-top: 10px;
}

.tag {
    display: inline-block;
    background-color: var(--bg-color);
    color: var(--accent-color);
    padding: 4px 10px;
    margin-right: 8px;
    margin-top: 5px;
    border-radius: 999px;
    font-size: 0.85rem;
}

.des {
    color: white;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
}

#menu-toggle {
    display: none;
}

.hamburger {
    display: none;
    font-size: 24px;
    cursor: pointer;
}

.nav-links {
    display: flex;
    gap: 1rem;
}

/* 手機版 */
@media (max-width: 768px) {
    .hamburger {
        display: block;
        color: white;
    }

    .nav-links {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        width: 160px;
        background: var(--bg-color);
        border: 1px solid var(--nav-hover);
        border-radius: 12px;
        padding: 10px;
        z-index: 999;
        flex-direction: column;
    }

    .nav-links a {
        display: block;
        padding: 10px;
        white-space: nowrap;
    }

    #menu-toggle:checked ~ .nav-links {
        display: flex;
    }
}

/* 🌌 藍紫色調優化版黑幕樣式 */
.spoiler {
    background-color: #1a1833; /* 使用比背景更深、更沉穩的暗紫色，取代原本死板的純黑 */
    color: #1a1833;            /* 未懸停時文字顏色與背景相同，達到隱藏效果 */
    border-radius: 4px;
    padding: 0 4px;
    transition: color 0.3s ease, background-color 0.3s ease;
}

/* 滑鼠懸停時看清文字 */
.spoiler:hover {
    color: var(--accent-color); /* 懸停時文字亮起，變成你的招牌粉紫色 */
    background-color: #2b2852;  /* 背景微微變亮，更有互動感 */
}</style>
